<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoki Station — SMAN 1 Gondanglegi</title>
<style>
:root{--bg:#fff;--bg2:#F1F5F9;--blue:#2589F5;--navy:#142B50;--green:#16A34A;--line:#dbe3ec;--mut:#5b6b82}
@media(prefers-color-scheme:dark){:root{--bg:#0f1b2d;--bg2:#17263d;--navy:#e8eef8;--line:#2a3b57;--mut:#9fb0c8}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg2);color:var(--navy)}
header{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1000px;margin:auto;display:flex;align-items:center;gap:10px;padding:8px 16px;flex-wrap:wrap}
.logo{color:var(--blue);font-size:19px}nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{padding:8px 12px;border-radius:10px;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}nav a.on{background:var(--blue);color:#fff}
main{max-width:1000px;margin:auto;padding:16px}.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:18px}.hero{background:var(--blue);color:#fff;border-radius:16px;padding:24px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:24px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;min-height:44px}
.btn.alt{background:var(--bg2);color:var(--navy);border:1px solid var(--line)}.hero .btn{background:#fff;color:var(--blue)}.hero .btn.alt{background:transparent;color:#fff;border-color:#fff}.sm{min-height:32px;padding:2px 10px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.tag{display:inline-block;background:var(--bg2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--blue)}
.mut{color:var(--mut);font-size:13px}.work{cursor:pointer}.work:hover{border-color:var(--blue)}.work h3{margin:6px 0 4px;font-size:17px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--navy);margin-bottom:10px}
.tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.rank{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.sp{flex:1}.av{font-size:24px}
.reader{border-radius:14px;padding:22px;margin:12px 0;line-height:1.8}.t-light{background:#fff;color:#1a1a1a}.t-dark{background:#141414;color:#e4e4e4}.t-warm{background:#f6ecd6;color:#4a3320}
.warn{color:#b45309;font-size:14px}.ok{color:var(--green);font-size:14px}.bar-bg{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}.bar-fg{height:100%;border-radius:99px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:700}
</style></head><body>
<header><div class="bar"><b class="logo">HOKI STATION</b><nav id="nav"></nav><div id="acc"></div></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== ISI DUA BARIS INI (Supabase: Project Settings > API). Kunci anon memang publik; keamanan ada di aturan RLS. ===== */
const SUPABASE_URL="ISI_DENGAN_PROJECT_URL",SUPABASE_KEY="ISI_DENGAN_ANON_PUBLIC_KEY";
/* ============================================================ */
const CATS=["Artikel","Berita","Cerpen","Cerbung","Dongeng","Fabel","Novelet","Opini","Pantun","Puisi","Religi","Resensi","Tutorial"];
const AV=["🍎","🍊","🍋","🍉","🍇","🍓","🍍","🥝","🍑","🥭","🍒","🍐","🥥","🍌","🫐","🍈","🍏","🥑","🍅","🫒"];
const ROLES=["siswa","guru","alumni","umum","admin"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id),words=s=>(s.trim().match(/\S+/g)||[]).length,card=h=>`<div class="card">${h}</div>`;
const fmt=d=>new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Jakarta"});
const av=p=>p.role=="admin"?"👑":esc(p.avatar);
const msg=(id,t,ok)=>{const e=$(id);if(e){e.className=ok?"ok":"warn";e.textContent=t}};
const V={},A={},AD={};let sb,me=null,REG=0,PICK="",LM="",ST="",NE=0,LC=0,LAP;
let RP={t:"light",s:17};try{RP=JSON.parse(localStorage.getItem("rp"))||RP}catch(e){}
const saveRP=()=>{try{localStorage.setItem("rp",JSON.stringify(RP))}catch(e){}};

async function boot(){
 if(SUPABASE_URL.startsWith("ISI")){$("app").innerHTML=card("<h2>Belum dikonfigurasi</h2><p>Isi SUPABASE_URL dan SUPABASE_KEY di bagian atas berkas index.html. Lihat README.</p>");return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 sb.auth.onAuthStateChange(ev=>{if(ev=="PASSWORD_RECOVERY")location.hash="#baru"});
 await load();addEventListener("hashchange",go);go()}
async function load(){me=null;ST="";const{data:{session}}=await sb.auth.getSession();if(!session)return;
 const{data}=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
 if(data&&data.status=="aktif")me=data;else{ST=data?data.status:"";if(location.hash!="#baru")await sb.auth.signOut()}}
function nav(){const r=location.hash.slice(1).split("-")[0];
 $("nav").innerHTML=me?[["beranda","Beranda"],["menulis","Menulis"],["karya","Karya"],["perpus","Perpustakaan Saya"],["panduan","Panduan"]].map(([k,t])=>`<a href="#${k}" class="${r==k?"on":""}">${t}</a>`).join(""):"";
 const s='class="btn alt sm" style="padding:4px 10px"';
 $("acc").innerHTML=me?`<a ${s} href="#profil">${av(me)} ${esc(me.nama.split(" ")[0])}</a> ${me.role=="admin"?`<a ${s} href="#admin">Admin</a>`:""} <button ${s} onclick="keluar()">Keluar</button>`:""}
async function go(){
 const [r,arg]=(location.hash||"#masuk").slice(1).split("-");
 if(!me&&r!="masuk"&&r!="baru"){location.hash="#masuk";return}
 nav();$("app").innerHTML='<p class="mut">Memuat…</p>';
 try{$("app").innerHTML=await (V[r]||V.beranda)(arg);if(A[r])A[r](arg)}catch(e){$("app").innerHTML=card('<p class="warn">Terjadi kesalahan: '+esc(e.message)+"</p>")}
 scrollTo(0,0)}
async function keluar(){await sb.auth.signOut();me=null;location.hash="#masuk";go()}

/* ---------- Akun ---------- */
V.masuk=async()=>{if(me){location.hash="#beranda";return""}
 const f=REG?`<input id="n" placeholder="Nama lengkap"><input id="u" placeholder="Username (huruf, angka, _)"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (minimal 8 karakter)"><input id="q" type="password" placeholder="Konfirmasi password"><div class="mut">Pilih avatar</div><div class="tools" id="avs">${AV.map(a=>`<button class="btn alt" onclick="PICK='${a}';[...$('avs').children].forEach(b=>b.style.outline='');this.style.outline='2px solid var(--blue)'">${a}</button>`).join("")}</div><button class="btn" onclick="daftar()">Daftar</button>`
 :`<input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password"><button class="btn" onclick="masuk()">Masuk</button> <button class="btn alt" onclick="lupa()">Lupa password</button>`;
 return card(`<button class="btn ${REG?"alt":""}" onclick="REG=0;go()">Masuk</button> <button class="btn ${REG?"":"alt"}" onclick="REG=1;go()">Daftar</button><div style="margin-top:12px">${f}<div id="m" class="warn" style="margin-top:8px">${esc(LM)}</div></div>`)};
async function masuk(){LM="";const{error}=await sb.auth.signInWithPassword({email:$("e").value.trim(),password:$("p").value});
 if(error)return msg("m","Email atau password salah.");await load();
 if(!me)return msg("m",ST=="menunggu"?"Akun Anda masih menunggu verifikasi admin.":"Akun ini tidak dapat digunakan. Hubungi admin perpustakaan.");
 location.hash="#beranda";go()}
async function daftar(){const n=$("n").value.trim(),u=$("u").value.trim(),e=$("e").value.trim(),p=$("p").value;let er="";
 if(n.length<2)er="Nama lengkap belum diisi.";else if(!/^[A-Za-z0-9_]{3,20}$/.test(u))er="Username 3–20 karakter: huruf, angka, atau garis bawah.";else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))er="Format email belum benar.";else if(p.length<8)er="Password minimal 8 karakter.";else if(p!==$("q").value)er="Konfirmasi password tidak sama.";
 if(er)return msg("m",er);
 const{error}=await sb.auth.signUp({email:e,password:p,options:{data:{nama:n,username:u,avatar:PICK||AV[0]}}});
 if(error)return msg("m","Pendaftaran gagal. Username atau email mungkin sudah dipakai.");
 await sb.auth.signOut();PICK="";msg("m","Pendaftaran terkirim. Akun berstatus Menunggu Verifikasi sampai disetujui admin. Jika diminta, konfirmasi dulu email Anda.",1)}
async function lupa(){const e=$("e").value.trim();if(!e)return msg("m","Isi email Anda dulu.");
 await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});msg("m","Jika email terdaftar, tautan reset password sudah dikirim.",1)}
V.baru=async()=>card(`<h2>Password baru</h2><input id="p" type="password" placeholder="Password baru (minimal 8 karakter)"><button class="btn" onclick="setBaru()">Simpan</button><div id="m"></div>`);
async function setBaru(){const p=$("p").value;if(p.length<8)return msg("m","Minimal 8 karakter.");const{error}=await sb.auth.updateUser({password:p});if(error)return msg("m",error.message);await sb.auth.signOut();LM="Password diubah. Silakan masuk.";location.hash="#masuk"}
async function ganti(){const p=$("p2").value;if(p.length<8)return msg("m2","Minimal 8 karakter.");const{error}=await sb.auth.updateUser({password:p});msg("m2",error?error.message:"Password diubah.",!error)}
V.profil=async()=>{const{data:my}=await sb.from("writings").select("id,judul,kategori,status,views").eq("user_id",me.id).order("created_at",{ascending:false});
 return card(`<div style="text-align:center"><div style="font-size:56px">${av(me)}</div><h2>${esc(me.nama)}</h2><span class="tag">${me.role}</span> <span class="mut">@${esc(me.username)} · bergabung ${fmt(me.created_at)}</span></div>`)
 +card(`<h2>Ubah profil</h2><input id="n" value="${esc(me.nama)}" placeholder="Nama"><textarea id="b" rows="2" placeholder="Bio singkat">${esc(me.bio)}</textarea>${me.role=="admin"?'<p class="mut">Akun admin memakai avatar mahkota.</p>':`<div class="tools">${AV.map(a=>`<button class="btn alt" onclick="PICK='${a}';simpanProfil()">${a}</button>`).join("")}</div>`}<button class="btn" onclick="simpanProfil()">Simpan</button><div id="m"></div>`)
 +card(`<h2>Ubah password</h2><input id="p2" type="password" placeholder="Password baru (minimal 8 karakter)"><button class="btn" onclick="ganti()">Ubah password</button><div id="m2"></div>`)
 +card("<h2>Karya saya</h2>"+(my.map(w=>`<div class="rank" style="flex-wrap:wrap"><span class="sp"><b>${esc(w.judul)}</b><br><span class="mut">${esc(w.kategori)} · ${w.status} · 👁 ${w.views}</span></span><a class="btn alt sm" href="#menulis-${w.id}">Edit</a><button class="btn alt sm" onclick="ubahStatus(${w.id},'${w.status=="arsip"?"terbit":"arsip"}')">${w.status=="arsip"?"Terbitkan":"Arsipkan"}</button><button class="btn alt sm" onclick="hapus(${w.id})">Hapus</button></div>`).join("")||'<p class="mut">Belum ada karya.</p>'))};
async function simpanProfil(){const n=$("n").value.trim();if(n.length<2)return msg("m","Nama minimal 2 karakter.");
 const{error}=await sb.from("profiles").update({nama:n,bio:$("b").value.trim().slice(0,300),avatar:me.role=="admin"?me.avatar:(PICK||me.avatar)}).eq("id",me.id);PICK="";
 if(error)return msg("m",error.message);await load();go()}

/* ---------- Beranda, menulis, karya ---------- */
V.beranda=async()=>{const{data}=await sb.from("news").select("*").order("created_at",{ascending:false}).limit(10);
 return `<div class="hero"><h1>Selamat datang, ${esc(me.nama)}</h1><p>Tempat warga SMAN 1 Gondanglegi membaca, menulis, dan berbagi karya.</p><a class="btn" href="#menulis">Mulai menulis</a> <a class="btn alt" href="#karya">Lihat karya</a></div>`
 +card("<h2>Berita &amp; pengumuman</h2>"+(data.map(n=>`<p><b>${esc(n.judul)}</b> <span class="mut">· ${fmt(n.created_at)}</span><br><span class="mut">${esc(n.isi)}</span></p>`).join("")||'<p class="mut">Belum ada berita.</p>'))};
V.menulis=async id=>{let w={judul:"",kategori:CATS[0],isi:""};
 if(id){const{data}=await sb.from("writings").select("*").eq("id",id).maybeSingle();if(!data||data.user_id!=me.id)return card("<p>Tulisan tidak ditemukan.</p>");w=data}
 return card(`<h2>${id?"Edit":"Tulis"} karya</h2><input id="j" placeholder="Judul" value="${esc(w.judul)}"><select id="k">${CATS.map(c=>`<option ${c==w.kategori?"selected":""}>${c}</option>`).join("")}</select><textarea id="i" rows="12" oninput="cnt()" placeholder="Mulai menulis. Pisahkan paragraf dengan baris baru.">${esc(w.isi)}</textarea><div id="wc" class="mut"></div><div id="m"></div><button class="btn alt" onclick="simpan(${id||0},'draf')">Simpan draf</button> <button class="btn" onclick="simpan(${id||0},'terbit')">Publikasikan</button>`)};
A.menulis=()=>cnt();
function cnt(){const n=words($("i").value);$("wc").innerHTML=n+" kata (minimal 10, maksimal 1.000) "+(n>1000?'<span class="warn">melebihi batas</span>':n<10?'<span class="warn">belum cukup untuk dipublikasikan</span>':'<span class="ok">siap diterbitkan</span>')}
async function simpan(id,st){const j=$("j").value.trim(),i=$("i").value,n=words(i);
 if(!j)return msg("m","Judul belum diisi.");if(n>1000)return msg("m","Maksimal 1.000 kata.");if(st=="terbit"&&n<10)return msg("m","Minimal 10 kata untuk dipublikasikan. Sekarang: "+n+" kata.");
 const row={judul:j,kategori:$("k").value,isi:i,status:st};
 const{error}=id?await sb.from("writings").update(row).eq("id",id):await sb.from("writings").insert(row);
 if(error)return msg("m",error.message);location.hash=st=="terbit"?"#karya":"#profil"}
async function ubahStatus(id,st){const{error}=await sb.from("writings").update({status:st}).eq("id",id);if(error)alert(error.message);go()}
async function hapus(id){if(confirm("Hapus karya ini secara permanen?")){await sb.from("writings").delete().eq("id",id);go()}}
const SEL="id,judul,kategori,isi,views,published_at,profiles(nama,avatar,role),likes(count),comments(count)";
const wc=w=>`<div class="card work" onclick="location.hash='#baca-${w.id}'"><span class="tag">${esc(w.kategori)}</span><h3>${esc(w.judul)}</h3><div class="mut">${av(w.profiles)} ${esc(w.profiles.nama)} · ${fmt(w.published_at)}</div><p>${esc(w.isi.slice(0,90))}…</p><div class="mut">👁 ${w.views} · ♥ ${w.likes[0].count} · 💬 ${w.comments[0].count}</div></div>`;
V.karya=async()=>card(`<input id="s" placeholder="Cari judul atau isi…" onkeydown="if(event.key=='Enter')cari()"><select id="c" onchange="cari()"><option value="">Semua kategori</option>${CATS.map(c=>`<option>${c}</option>`).join("")}</select><select id="o" onchange="cari()"><option value="published_at">Terbaru</option><option value="views">Paling banyak dibaca</option></select><button class="btn" onclick="cari()">Cari</button>`)+'<div id="list" class="grid"></div>';
A.karya=()=>cari();
async function cari(){let q=sb.from("writings").select(SEL).eq("status","terbit");const s=$("s").value.trim().replace(/[%,()*]/g,"");
 if(s)q=q.or(`judul.ilike.%${s}%,isi.ilike.%${s}%`);if($("c").value)q=q.eq("kategori",$("c").value);
 const{data,error}=await q.order($("o").value,{ascending:false}).limit(60);
 $("list").innerHTML=error?'<p class="warn">'+esc(error.message)+"</p>":data.length?data.map(wc).join(""):'<p class="mut">Belum ada karya yang cocok.</p>'}
V.perpus=async()=>{const{data}=await sb.from("bookmarks").select(`writings(${SEL})`).eq("user_id",me.id);const l=data.map(b=>b.writings).filter(w=>w&&w.published_at);
 return card("<h2>Perpustakaan Saya</h2>"+(l.length?'<div class="grid">'+l.map(wc).join("")+"</div>":'<p class="mut">Belum ada karya tersimpan. Buka sebuah karya lalu tekan Simpan.</p>'))};

/* ---------- Baca, suka, simpan, komentar ---------- */
V.baca=async id=>{const{data:w}=await sb.from("writings").select("*,profiles(nama,avatar,role),likes(user_id),bookmarks(user_id)").eq("id",id).maybeSingle();
 if(!w)return card("<p>Karya tidak ditemukan.</p>");
 try{if(w.status=="terbit"&&!sessionStorage.getItem("v"+id)){sessionStorage.setItem("v"+id,1);sb.rpc("add_view",{wid:+id})}}catch(e){}
 const{data:cm}=await sb.from("comments").select("*,profiles(nama,avatar,role)").eq("writing_id",id).order("created_at");
 const liked=w.likes.some(l=>l.user_id==me.id),saved=w.bookmarks.some(b=>b.user_id==me.id),adm=me.role=="admin";
 const it=(c,lv)=>`<div style="padding:10px 0;border-top:1px solid var(--line);margin-left:${lv?28:0}px"><div>${av(c.profiles)} <b>${esc(c.profiles.nama)}</b> <span class="mut">· ${fmt(c.created_at)}${c.hidden?" · disembunyikan":""}</span></div><p style="margin:6px 0">${esc(c.isi)}</p>${lv?"":`<button class="btn alt sm" onclick="balas(${w.id},${c.id})">Balas</button> `}${c.user_id!=me.id?`<button class="btn alt sm" onclick="lapor(${c.id})">Lapor</button> `:""}${c.user_id==me.id||adm?`<button class="btn alt sm" onclick="hpsKm(${c.id})">Hapus</button> `:""}${adm?`<button class="btn alt sm" onclick="hideKm(${c.id},${!c.hidden})">${c.hidden?"Pulihkan":"Sembunyikan"}</button>`:""}</div>`;
 return `<a class="btn alt" href="#karya">← Kembali</a>`+card(`<span class="tag">${esc(w.kategori)}</span><h2 style="font-size:22px;margin-top:8px">${esc(w.judul)}</h2><div class="mut">${av(w.profiles)} ${esc(w.profiles.nama)} · ${w.published_at?fmt(w.published_at):"belum terbit"} · ±${Math.max(1,Math.round(words(w.isi)/200))} menit baca · 👁 ${w.views}</div><div class="tools" style="margin-top:10px">${[["light","Terang"],["dark","Gelap"],["warm","Hangat"]].map(([k,t])=>`<button class="btn alt" onclick="tema('${k}')">${t}</button>`).join("")}<button class="btn alt" onclick="ukuran(-1)">A−</button><button class="btn alt" onclick="ukuran(1)">A+</button></div><div id="rd" class="reader t-${RP.t}" style="font-size:${RP.s}px">${w.isi.split("\n").filter(p=>p.trim()).map(p=>`<p>${esc(p)}</p>`).join("")}</div><button class="btn alt" onclick="suka(${w.id},${liked})">${liked?"♥ Disukai":"♡ Suka"} (${w.likes.length})</button> <button class="btn alt" onclick="simpanBk(${w.id},${saved})">${saved?"🔖 Tersimpan":"🔖 Simpan"}</button>`)
 +card(`<h2>Komentar (${cm.filter(c=>!c.hidden).length})</h2><textarea id="ck" rows="3" placeholder="Tulis komentar yang sopan…"></textarea><button class="btn" onclick="kirimKm(${w.id},null)">Kirim komentar</button><div id="m"></div>`+(cm.filter(c=>!c.parent_id).map(c=>it(c,0)+cm.filter(r=>r.parent_id==c.id).map(r=>it(r,1)).join("")).join("")||'<p class="mut">Belum ada komentar.</p>'))};
const tema=t=>{RP.t=t;saveRP();$("rd").className="reader t-"+t};
const ukuran=d=>{RP.s=Math.max(13,Math.min(28,RP.s+d*2));saveRP();$("rd").style.fontSize=RP.s+"px"};
async function suka(id,l){l?await sb.from("likes").delete().match({writing_id:id,user_id:me.id}):await sb.from("likes").insert({writing_id:id});go()}
async function simpanBk(id,s){s?await sb.from("bookmarks").delete().match({writing_id:id,user_id:me.id}):await sb.from("bookmarks").insert({writing_id:id});go()}
async function kirimKm(wid,pid,t){t=t??$("ck").value.trim();if(!t)return msg("m","Komentar tidak boleh kosong.");if(t.length>500)return msg("m","Maksimal 500 karakter.");
 if(Date.now()-LC<10000)return msg("m","Tunggu beberapa detik sebelum mengirim lagi.");
 const{error}=await sb.from("comments").insert({writing_id:wid,parent_id:pid,isi:t});if(error)return alert(error.message);LC=Date.now();go()}
function balas(w,c){const t=prompt("Tulis balasan (maksimal 500 karakter)");if(t&&t.trim())kirimKm(w,c,t.trim())}
async function lapor(id){await sb.rpc("report_comment",{cid:id});alert("Terima kasih, laporan dikirim ke admin.");go()}
async function hpsKm(id){if(confirm("Hapus komentar ini?")){await sb.from("comments").delete().eq("id",id);go()}}
async function hideKm(id,h){await sb.from("comments").update({hidden:h}).eq("id",id);go()}
async function tutupLap(id){await sb.from("comments").update({reported:false}).eq("id",id);go()}

/* ---------- Admin ---------- */
V.admin=async tab=>{tab=AD[tab]?tab:"laporan";if(me.role!="admin")return card("<p>Halaman ini khusus admin.</p>");
 return `<div class="tools">${[["laporan","Laporan"],["verifikasi","Verifikasi"],["akun","Akun"],["berita","Berita"],["moderasi","Moderasi"]].map(([k,t])=>`<a class="btn ${k==tab?"":"alt"}" href="#admin-${k}">${t}</a>`).join("")}</div>`+await AD[tab]()};
AD.verifikasi=async()=>{const{data}=await sb.from("profiles").select("*").eq("status","menunggu").order("created_at");
 return card("<h2>Verifikasi akun baru</h2>"+(data.map(p=>`<div class="rank" style="flex-wrap:wrap"><span class="av">${esc(p.avatar)}</span><span class="sp"><b>${esc(p.nama)}</b><br><span class="mut">@${esc(p.username)} · ${fmt(p.created_at)}</span></span><select id="r${p.id}" style="width:auto;margin:0">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select><button class="btn" onclick="setProf('${p.id}','aktif')">Setujui</button><button class="btn alt" onclick="setProf('${p.id}','ditolak')">Tolak</button></div>`).join("")||'<p class="mut">Tidak ada akun yang menunggu verifikasi.</p>'))};
async function setProf(id,st){const r=$("r"+id);const{error}=await sb.from("profiles").update(r&&st=="aktif"?{status:st,role:r.value}:{status:st}).eq("id",id);if(error)alert(error.message);go()}
async function setRole(id,r){const{error}=await sb.from("profiles").update({role:r}).eq("id",id);if(error)alert(error.message);go()}
AD.akun=async()=>{const{data}=await sb.from("profiles").select("*").order("created_at",{ascending:false});
 return card("<h2>Semua akun</h2>"+data.map(p=>`<div class="rank" style="flex-wrap:wrap"><span class="av">${av(p)}</span><span class="sp"><b>${esc(p.nama)}</b><br><span class="mut">@${esc(p.username)} · ${p.status}</span></span>${p.id==me.id?'<span class="tag">Anda</span>':`<select style="width:auto;margin:0" onchange="setRole('${p.id}',this.value)">${ROLES.map(r=>`<option ${r==p.role?"selected":""}>${r}</option>`).join("")}</select><button class="btn alt" onclick="setProf('${p.id}','${p.status=="aktif"?"nonaktif":"aktif"}')">${p.status=="aktif"?"Nonaktifkan":"Aktifkan"}</button>`}</div>`).join(""))};
AD.berita=async()=>{const{data}=await sb.from("news").select("*").order("created_at",{ascending:false});const e=data.find(n=>n.id==NE)||{judul:"",isi:""};
 return card(`<h2>${NE?"Edit":"Tulis"} berita atau pengumuman</h2><input id="nj" placeholder="Judul" value="${esc(e.judul)}"><textarea id="ni" rows="4" placeholder="Isi">${esc(e.isi)}</textarea><button class="btn" onclick="simpanNews()">${NE?"Simpan perubahan":"Terbitkan"}</button>${NE?' <button class="btn alt" onclick="NE=0;go()">Batal</button>':""}<div id="m"></div>`)
 +card("<h2>Daftar berita</h2>"+(data.map(n=>`<div class="rank"><span class="sp"><b>${esc(n.judul)}</b><br><span class="mut">${fmt(n.created_at)}</span></span><button class="btn alt sm" onclick="NE=${n.id};go()">Edit</button><button class="btn alt sm" onclick="hpsNews(${n.id})">Hapus</button></div>`).join("")||'<p class="mut">Belum ada berita.</p>'))};
async function simpanNews(){const j=$("nj").value.trim(),i=$("ni").value.trim();if(!j||!i)return msg("m","Judul dan isi wajib diisi.");
 const{error}=NE?await sb.from("news").update({judul:j,isi:i}).eq("id",NE):await sb.from("news").insert({judul:j,isi:i});if(error)return msg("m",error.message);NE=0;go()}
async function hpsNews(id){if(confirm("Hapus berita ini?")){await sb.from("news").delete().eq("id",id);go()}}
AD.moderasi=async()=>{const[{data:rc},{data:ws}]=await Promise.all([sb.from("comments").select("*,profiles(nama),writings(judul)").eq("reported",true),sb.from("writings").select("id,judul,kategori,status,profiles(nama)").order("created_at",{ascending:false}).limit(100)]);
 return card(`<h2>Komentar dilaporkan (${rc.length})</h2>`+(rc.map(c=>`<div class="rank" style="flex-wrap:wrap"><span class="sp"><b>${esc(c.profiles.nama)}</b> pada ${esc(c.writings.judul)}<br><span class="mut">${esc(c.isi)}</span></span><button class="btn alt sm" onclick="hideKm(${c.id},${!c.hidden})">${c.hidden?"Pulihkan":"Sembunyikan"}</button><button class="btn alt sm" onclick="tutupLap(${c.id})">Tutup laporan</button></div>`).join("")||'<p class="mut">Tidak ada laporan.</p>'))
 +card("<h2>Moderasi karya</h2>"+(ws.map(w=>`<div class="rank" style="flex-wrap:wrap"><span class="sp"><b>${esc(w.judul)}</b><br><span class="mut">${esc(w.profiles.nama)} · ${esc(w.kategori)} · ${w.status}</span></span>${w.status=="terbit"||w.status=="disembunyikan"?`<button class="btn alt sm" onclick="ubahStatus(${w.id},'${w.status=="terbit"?"disembunyikan":"terbit"}')">${w.status=="terbit"?"Sembunyikan":"Pulihkan"}</button>`:""}<button class="btn alt sm" onclick="hapus(${w.id})">Hapus</button></div>`).join("")||'<p class="mut">Belum ada karya.</p>'))};
AD.laporan=async()=>{const[{data:ps},{data:ws},{count:nl},{count:nk}]=await Promise.all([sb.from("profiles").select("nama,username,role,status,created_at"),sb.from("writings").select("judul,kategori,status,views,published_at,profiles(nama)"),sb.from("likes").select("*",{count:"exact",head:true}),sb.from("comments").select("*",{count:"exact",head:true})]);
 LAP={ps,ws};const c=(a,f)=>a.filter(f).length,cat={};ws.filter(w=>w.status=="terbit").forEach(w=>cat[w.kategori]=(cat[w.kategori]||0)+1);
 const st=[["Total akun",ps.length],["Menunggu verifikasi",c(ps,p=>p.status=="menunggu")],["Siswa",c(ps,p=>p.role=="siswa")],["Guru",c(ps,p=>p.role=="guru")],["Alumni",c(ps,p=>p.role=="alumni")],["Umum",c(ps,p=>p.role=="umum")],["Karya terbit",c(ws,w=>w.status=="terbit")],["Karya diarsipkan",c(ws,w=>w.status=="arsip")],["Total pembaca",ws.reduce((a,w)=>a+w.views,0)],["Total like",nl],["Total komentar",nk]];
 const mx=Math.max(1,...Object.values(cat));
 return card(`<h2>Laporan &amp; Statistik</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${st.map(s=>`<div class="card" style="margin:0"><div class="mut">${s[0]}</div><div style="font-size:26px;font-weight:800;color:var(--blue)">${s[1]}</div></div>`).join("")}</div>`)
 +card("<h2>Karya per kategori</h2>"+(Object.keys(cat).map(k=>`<div style="margin-bottom:8px">${esc(k)} (${cat[k]})<div class="bar-bg"><div class="bar-fg" style="width:${Math.round(cat[k]/mx*100)}%;background:var(--blue)"></div></div></div>`).join("")||'<p class="mut">Belum ada karya.</p>'))
 +card('<h2>Unduh laporan (CSV)</h2><button class="btn alt" onclick="csv(0)">Daftar akun</button> <button class="btn alt" onclick="csv(1)">Daftar karya</button><p class="mut">Excel, PDF, Word, dan backup otomatis belum tersedia di versi ini.</p>')};
function csv(k){const rows=k?[["Judul","Kategori","Penulis","Status","Pembaca","Terbit"],...LAP.ws.map(w=>[w.judul,w.kategori,w.profiles.nama,w.status,w.views,w.published_at||""])]:[["Nama","Username","Peran","Status","Bergabung"],...LAP.ps.map(p=>[p.nama,p.username,p.role,p.status,p.created_at])];
 const t="\ufeff"+rows.map(r=>r.map(x=>{x=String(x);if(/^[=+\-@]/.test(x))x="'"+x;return'"'+x.replace(/"/g,'""')+'"'}).join(",")).join("\r\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=(k?"karya":"akun")+"-hoki-station.csv";a.click()}

V.panduan=async()=>{const d=[["Memulai","Buka Daftar, isi data, dan pilih avatar. Akun berstatus Menunggu Verifikasi sampai admin menyetujui dan menetapkan perannya. Setelah itu masuk dengan email dan password."],["Menulis dan menerbitkan","Buka Menulis, isi judul, pilih kategori, dan tulis karya (10–1.000 kata, dihitung langsung). Simpan sebagai draf atau Publikasikan agar langsung tampil di Karya. Karya Anda bisa diedit, diarsipkan, atau dihapus dari Profil."],["Membaca","Buka sebuah karya, pilih tema Terang, Gelap, atau Hangat dan ukuran huruf. Pengaturan ini hanya mengubah area bacaan dan tersimpan di browser Anda. Tekan Suka atau Simpan (masuk ke Perpustakaan Saya)."],["Komentar","Tulis komentar (maks. 500 karakter) atau balas komentar lain. Gunakan bahasa sopan. Komentar yang tidak pantas bisa dilaporkan ke admin."],["Aturan bersama","Tulis karya sendiri, jangan menjiplak, hindari SARA, ujaran kebencian, kekerasan, dan konten dewasa, serta jangan membagikan data pribadi. Pelanggaran dapat membuat karya atau komentar disembunyikan admin."]];
 if(me.role=="admin")d.push(["Khusus admin","Panel Admin: Laporan (statistik dan unduhan CSV), Verifikasi akun baru dan penetapan peran, Akun, Berita, serta Moderasi karya dan komentar yang dilaporkan."]);
 return card("<h2>Panduan pengguna</h2>"+d.map((x,i)=>`<details ${i?"":"open"}><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join(""))};
boot();
</script></body></html>
